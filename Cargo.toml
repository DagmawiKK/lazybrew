[package]
name = "lazybrew"
version = "0.1.0"
edition = "2024"
description = "A lazygit-inspired, btop-styled terminal UI for Homebrew, written in Rust with ratatui"
license = "MIT"
repository = "https://github.com/DagmawiKK/lazybrew"
readme = "README.md"
keywords = ["homebrew", "tui", "terminal", "ratatui", "brew"]
categories = ["command-line-utilities"]
# Keep the uploaded .crate lean: no CI files or 900KB of screenshots.
exclude = [".github/", "docs/"]

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
dirs = "7.0.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
